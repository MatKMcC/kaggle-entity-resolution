stages:
  prepare_data:
    cmd: python ../src/preparation.py --config ${config}
    deps:
      - ../src/preparation.py
      - ../data/source/sample/source1.tsv
      - ../data/source/sample/source2.tsv
      - ../data/source/sample/source3.tsv
      - ../data/source/sample/ground_truth.tsv
    params:
      - config
      - config.yaml:
        - train_entities
        - train_datasets
        - ground_truth
        - random_states.preparation
    outs:
      - ../data/source/sample/set_assignments.tsv

  preprocess_data:
    cmd: python ../src/preprocess.py --config ${config}
    deps:
      - ../src/preprocess.py
      - ../data/source/sample/source1.tsv
      - ../data/source/sample/source2.tsv
      - ../data/source/sample/source3.tsv
      - ../data/source/sample/ground_truth.tsv
    params:
      - config
      - config.yaml:
          - train_entities
          - train_datasets
          - ground_truth
          - random_states.preparation
    outs:
      - ../data/processed/sample/source1.tsv
      - ../data/processed/sample/source2.tsv
      - ../data/processed/sample/source3.tsv

  train_model:
    cmd: python ../src/train.py --config ${config}
    deps:
      - ../src/train.py
      - ../src/featurize.py
      - ../data/source/sample/set_assignments.tsv
      - ../data/processed/sample/source1.tsv
      - ../data/processed/sample/source2.tsv
      - ../data/processed/sample/source3.tsv
    params:
      - config
      - config.yaml:
        - train_entities
        - train_datasets
        - set_assignments
        - model_path
        - random_states.training
    outs:
      - ../data/source/sample/models/logistic_model.joblib

  make_matches:
    cmd: python ../src/predict.py --config ${config}
    deps:
      - ../src/predict.py
      - ../data/source/sample/models/logistic_model.joblib
    params:
      - config
      - config.yaml:
        - predict_entities
        - predict_datasets
        - predicted_matches
        - runtime_cutoff
    outs:
      - ../data/source/sample/predictions/predictions.pkl

  evaluate_matches:
    cmd: python ../src/evaluate.py --config ${config}
    deps:
      - ../src/evaluate.py
      - ../data/source/sample/predictions/predictions.pkl
    params:
      - config
      - config.yaml:
        - evaluate_datasets
        - evaluation_metrics
    outs:
      - ../data/source/sample/evaluations/metrics.pkl